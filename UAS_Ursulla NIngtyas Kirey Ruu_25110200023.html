 luas. Karena itu saya berusaha lebih keras: mempelajari dashboard ini bagian per bagian, mengoreksinya sendiri, lalu memastikan hasilnya dengan teman yang lebih paham.\",\"Hal yang paling membekas: hasil backtest yang bagus belum tentu berarti strateginya bagus. CAGR strategi saya 22,5% per tahun terlihat meyakinkan, tetapi setelah dicek lebih dalam, labanya bergantung pada segelintir trade. Satu trade saja (WIFI) menyumbang sekitar 92% laba bersih, dan tanpa lima trade terbaik CAGR turun ke 6,7%. Win ratio hanya 31%, jadi strategi ini lebih sering kalah dan baru untung karena sesekali ada trade yang naik sangat besar. Hasil walk-forward di luar sampel juga negatif (sekitar -3,8%) dan uji sensitivitas tidak lolos kriteria stabil.\",\"Awalnya saya ingin menonjolkan angka yang bagus saja. Namun saya sadar tujuan dashboard ini adalah menguji strategi, bukan membuktikan strateginya hebat, sehingga menyampaikan kelemahannya dengan jujur lebih penting. Saya juga belajar bahwa detail kecil seperti fee, spread, batas likuiditas, dan eksekusi di harga pembukaan hari berikutnya berpengaruh besar pada hasil.\",\"Ke depan saya ingin lebih berani bertanya dan berdiskusi, tidak minder hanya karena masih pemula. Dengan meminta dikoreksi teman, saya bisa menemukan kesalahan yang tidak terlihat kalau dikerjakan sendiri.\"]}}\u003c/script\u003e\n\u003cscript\u003e\n\"use strict\";\nconst D = JSON.parse(document.getElementById(\"DATA\").textContent);\nconst $ = (s, el = document) =\u003e el.querySelector(s);\nconst C = D.cfg, m = D.metrics, P = D.params, PER = D.periods;\nconst PINK = \"#ff6f9c\", SKY = \"#3fa9f5\", LILAC = \"#8b7cf6\", MINT = \"#17b890\";\n/* ---------- format ---------- */\nconst nf = (x, d = 0) =\u003e x == null || !isFinite(x) ? \"—\" : x.toLocaleString(\"id-ID\", {minimumFractionDigits: d, maximumFractionDigits: d});\nconst pct = (x, d = 2) =\u003e x == null || !isFinite(x) ? \"—\" : nf(x * 100, d) + \"%\";\nconst pp = (x, d = 2) =\u003e x == null || !isFinite(x ${P.enter} dan RSI[t] ≥ ${P.enter}${tr}. Order beli dieksekusi di \u003cb\u003eharga pembukaan t+1\u003c/b\u003e (+${C.spread_ticks} fraksi spread).\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eSyarat keluar:\u003c/b\u003e RSI[t−1] ≥ ${P.exit} dan RSI[t] \u0026lt; ${P.exit}. Order jual di \u003cb\u003eharga pembukaan t+1\u003c/b\u003e (−${C.spread_ticks} fraksi). Tanpa stop-loss/take-profit.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eUkuran posisi:\u003c/b\u003e maksimal ${C.max_pos} posisi, masing-masing ${pct(C.pos_pct, 0)} dari ekuitas saat sinyal; ${C.compound ? \"keuntungan diputar kembali (compounding)\" : \"tanpa compounding\"}; dibulatkan ke bawah ke kelipatan 1 lot (${C.lot} lembar).\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eBila sinyal \u0026gt; slot kosong:\u003c/b\u003e prioritas saham dengan rata-rata nilai transaksi 20 hari terbesar (aturan objektif, tanpa penilaian subjektif).\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eModal awal:\u003c/b\u003e ${rp(C.capital)}. Maks. 1 posisi per saham. Tanpa short selling dan margin.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eParameter terpilih:\u003c/b\u003e RSI periode ${P.rsi_n}, level masuk ${P.enter}, level keluar ${P.exit}, filter tren SMA ${P.trend || \"—\"}. ${esc(D.meta.params_source)}.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n  \u003cdiv class=\"card\"\u003e\u003ch3\u003eAsumsi biaya, eksekusi \u0026 data\u003c/h3\u003e\u003ctable\u003e\u003ctbody\u003e\n   \u003ctr\u003e\u003ctd\u003eFee beli / jual\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(C.fee_buy, 2)} / ${pct(C.fee_sell, 2)} (jual termasuk PPh final 0,1%)\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eSpread\u003c/td\u003e\u003ctd class=\"num\"\u003ebeli di open + ${C.spread_ticks} fraksi (offer), jual di open − ${C.spread_ticks} fraksi (bid)\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eFraksi harga BEI\u003c/td\u003e\u003ctd class=\"num\"\u003e\u0026lt;200: 1 · 200–\u0026lt;500: 2 · 500–\u0026lt;2.000: 5 · 2.000–\u0026lt;5.000: 10 · ≥5.000: 25\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eLot\u003c/td\u003e\u003ctd class=\"num\"\u003e1 lot = ${C.lot} lembar; tanpa pembelian pecahan\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eLikuiditas\u003c/td\u003e\u003ctd class=\"num\"\u003e1 order ≤ ${pct(C.liq_cap, 0)} rata-rata nilai transaksi ${C.liq_days} hari terakhir\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eARA/ARB \u0026amp; suspensi\u003c/td\u003e\u003ctd class=\"num\"\u003etak terisi bila terkunci ARA (beli) / ARB (jual) atau tanpa volume\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003ePenyelesaian kas\u003c/td\u003e\u003ctd class=\"num\"\u003ehasil jual dipakai membeli mulai hari berikutnya\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eSuku bunga bebas risiko\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(C.rf, 1)} per tahun (Sharpe \u0026amp; Sortino)\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003eSumber \u0026amp; tanggal unduh\u003c/td\u003e\u003ctd class=\"num\"\u003e${esc(D.meta.source)} · ${D.meta.download_date}\u003c/td\u003e\u003c/tr\u003e\n   \u003ctr\u003e\u003ctd\u003ePeriode data\u003c/td\u003e\u003ctd class=\"num\"\u003e${PER.data_start} s/d ${PER.data_end}\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e\n   ${D.meta.data_notes \u0026\u0026 D.meta.data_notes.length ? `\u003cdiv class=\"card\"\u003e\u003ch3\u003eKualitas data \u0026 pembersihan\u003c/h3\u003e\u003cul class=\"rules\"\u003e${D.meta.data_notes.map(x =\u003e `\u003cli\u003e${esc(x)}\u003c/li\u003e`).join(\"\")}\u003c/ul\u003e\u003c/div\u003e` : \"\"}`;\n})();\n\n/* ---------- metrik ---------- */\n(function () {\n  const bn = D.meta.benchmarks[0], b = bn ? D.bench[bn] : null;\n  const main = [\n    card(\"CAGR\", pct(m.cagr), `(ekuitas akhir ÷ awal)^(1÷${nf(m.years, 2)} thn) − 1`, sg(m.cagr)),\n    card(\"Win ratio\", pct(m.win_ratio, 1), `${nf(m.n_trades)} trade tertutup; untung = hasil bersih \u003e 0`),\n    card(\"Avg profit\", pp(m.avg_profit_pct), `rata-rata trade untung · ${rp(m.avg_profit_rp)}`, \"pos\"),\n    card(\"Avg loss\", pp(m.avg_loss_pct), `rata-rata trade rugi · ${rp(m.avg_loss_rp)}`, \"neg\"),\n    card(\"Profit factor\", pfTxt(m.profit_factor), \"laba trade untung ÷ |rugi trade rugi| (Rp)\", m.profit_factor \u003e 1 ? \"pos\" : \"neg\"),\n    card(\"% bulan rekor baru\", pct(m.pct_record_months, 1), `${m.record_months} dari ${m.n_months} bulan ekuitas ≥ puncak sebelumnya`)];\n  const sec = [\n    card(\"Max drawdown\", pct(m.mdd), \"puncak→lembah ekuitas harian, posisi dinilai harga pasar\", \"neg\"),\n    card(\"Bulan terlama tanpa rekor\", nf(m.longest_no_record_months) + \" bulan\", \"periode terpanjang sebelum ekuitas melewati puncak\"),\n    card(\"Jumlah trade\", nf(m.n_trades), `${nf(m.trades_per_year, 1)} trade/tahun · rata-rata ${nf(m.avg_hold_days, 1)} hari memegang`),\n    card(\"Expectancy\", pp(m.expectancy_pct), \"WR × avg profit + (1−WR) × avg loss\", sg(m.expectancy_pct)),\n    card(\"Payoff ratio\", nf(m.payoff, 2), \"avg profit ÷ |avg loss|\"),\n    card(\"Sharpe ratio\", nf(m.sharpe, 2), `rata-rata ÷ simpangan baku return bulanan × √12 (rf = ${pct(m.rf, 1)})`),\n    card(\"Calmar ratio\", nf(m.calmar, 2), \"CAGR ÷ |MDD|\"),\n    card(\"Exposure\", pct(m.exposure_days, 1), `hari dengan posisi terbuka · rata-rata modal terpakai ${pct(m.avg_capital_used, 1)}`),\n    card(\"Buy \u0026amp; hold \" + (bn ? bl(bn) : \"—\"), b ? pct(b.cagr) : \"—\", b ? `CAGR · MDD ${pct(b.mdd)} · periode sama` : \"tidak tersedia\", b ? sg(b.cagr) : \"\"),\n    card(\"Porsi biaya\", pct(m.cost_share, 1), `fee + spread ÷ laba kotor · ${rp(m.total_fee + m.total_spread)} (fee ${rp(m.total_fee)})`)];\n  if (D.meta.benchmarks[1]) { const b2 = D.bench[D.meta.benchmarks[1]]; sec.push(card(\"Buy \u0026amp; hold \" + bl(D.meta.benchmarks[1]), pct(b2.cagr), `CAGR · MDD ${pct(b2.mdd)}`, sg(b2.cagr))); }\n  const bonus = [\n    card(\"Sortino ratio\", nf(m.sortino, 2), \"rata-rata ÷ deviasi downside bulanan × √12\"),\n    card(\"Kekalahan beruntun terpanjang\", nf(m.longest_losing_streak) + \" trade\", \"urut tanggal keluar\"),\n    card(\"Kontribusi 10 trade terbaik\", pct(m.top10_contrib, 1), \"dari total laba bersih trade tertutup\"),\n    card(\"Ekuitas akhir\", rp(m.end_equity), `dari modal ${rp(m.capital)} · total ${pct(m.total_return, 1)}`, sg(m.total_return))];\n  $(\"#metrics\").innerHTML = `\u003cdiv class=\"note\"\u003eSeluruh angka dihitung \u003cb\u003esesudah fee dan spread\u003c/b\u003e, untuk periode ${m.start} s/d ${m.end}. Posisi yang masih terbuka diperlakukan terpisah (bawah) dan tidak dihitung sebagai trade tertutup.${m.small_sample ? ' \u003cb\u003eCatatan: jumlah trade \u0026lt; 100 — sampel kecil.\u003c/b\u003e' : \"\"}\u003c/div\u003e\n   \u003ch4 class=\"sub\" style=\"margin:6px 0\"\u003eMetrik utama\u003c/h4\u003e\u003cdiv class=\"grid\"\u003e${main.join(\"\")}\u003c/div\u003e\n   \u003ch4 class=\"sub\" style=\"margin:14px 0 6px\"\u003eMetrik pelengkap\u003c/h4\u003e\u003cdiv class=\"grid\"\u003e${sec.join(\"\")}\u003c/div\u003e\n   \u003ch4 class=\"sub\" style=\"margin:14px 0 6px\"\u003eMetrik tambahan (bonus)\u003c/h4\u003e\u003cdiv class=\"grid\"\u003e${bonus.join(\"\")}\u003c/div\u003e\n   \u003ch4 class=\"sub\" style=\"margin:14px 0 6px\"\u003ePosisi masih terbuka di akhir periode backtest (dinilai harga terakhir, tidak dihitung sebagai trade tertutup)\u003c/h4\u003e\n   \u003cdiv class=\"scroll\" style=\"max-height:260px\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eAset\u003c/th\u003e\u003cth\u003eTgl masuk\u003c/th\u003e\u003cth class=\"num\"\u003eHarga masuk\u003c/th\u003e\u003cth class=\"num\"\u003eLot\u003c/th\u003e\u003cth class=\"num\"\u003eHarga terakhir\u003c/th\u003e\u003cth class=\"num\"\u003eNilai\u003c/th\u003e\u003cth class=\"num\"\u003eP/L mengambang\u003c/th\u003e\u003cth class=\"num\"\u003e%\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${\n     D.open_end.length ? D.open_end.map(o =\u003e `\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${o.s}\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e${o.entry}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.entry_px)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.shares / C.lot)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.last)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${rp(o.value)}\u003c/td\u003e\u003ctd class=\"num ${sg(o.unreal)}\"\u003e${rp(o.unreal)}\u003c/td\u003e\u003ctd class=\"num ${sg(o.unreal_pct)}\"\u003e${pp(o.unreal_pct)}\u003c/td\u003e\u003c/tr\u003e`).join(\"\") : '\u003ctr\u003e\u003ctd colspan=\"8\" class=\"sub\"\u003eTidak ada posisi terbuka.\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`;\n})();\n\n/* ---------- ekuitas ---------- */\nconst EQ = D.equity, BN = D.meta.benchmarks;\nconst isIdx = EQ.d.indexOf(PER.is_end);\nfunction drawEquity() {\n  const colors = [SKY, LILAC], names = BN.map(b =\u003e \"Buy\u0026hold \" + bl(b));\n  const s1 = [{name: \"Strategi (sesudah biaya)\", color: PINK, values: EQ.e, w: 2.4, area: false}].concat(BN.map((b, i) =\u003e ({name: names[i], color: colors[i], values: EQ.bench[b].eq, dash: true})));\n  lineChart($(\"#cEq\"), {labels: EQ.d, series: s1, log: true, yfmt: v =\u003e \"Rp\" + nf(v / 1e6, 0) + \" jt\", tipfmt: v =\u003e rp(v), height: 330, vlines: [{i: isIdx, label: \"IS | OOS\"}]});\n  const s2 = [{name: \"Strategi\", color: PINK, values: EQ.dd, area: true, w: 2}].concat(BN.map((b, i) =\u003e ({name: names[i], color: colors[i], values: EQ.bench[b].dd, dash: true})));\n  lineChart($(\"#cDd\"), {labels: EQ.d, series: s2, yfmt: v =\u003e pct(v, 0), tipfmt: v =\u003e pct(v), height: 190, zero: true, area: true});\n}\n$(\"#equity\").innerHTML = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eEkuitas (skala logaritmik) vs beli-dan-tahan\u003c/h3\u003e${legend([[\"Strategi\", PINK]].concat(BN.map((b, i) =\u003e [\"Buy \u0026 hold \" + bl(b), [SKY, LILAC][i], 1])))}\u003cdiv class=\"chart\" id=\"cEq\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"sub\"\u003eGaris ungu putus-putus memisahkan in-sample (70% awal) dan out-of-sample (30% akhir). Benchmark dinormalisasi ke modal awal. Sistem tidak wajib mengalahkan benchmark.\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"card\"\u003e\u003ch3\u003eDrawdown\u003c/h3\u003e\u003cdiv class=\"chart\" id=\"cDd\"\u003e\u003c/div\u003e\u003c/div\u003e`;\n\n/* ---------- bulanan / tahunan / histogram ---------- */\nfunction benchYear(b) { const e = EQ.bench[b].eq, out = {}; let prev = e[0], cy = EQ.d[0].slice(0, 4);\n  for (let i = 1; i \u003c e.length; i++) { const y = EQ.d[i].slice(0, 4); if (y !== cy) { out[cy] = e[i - 1] / prev - 1; prev = e[i - 1]; cy = y; } }\n  out[cy] = e[e.length - 1] / prev - 1; return out; }\n(function () {\n  const mm = {}; D.monthly.forEach(([y, mo, r]) =\u003e { (mm[y] = mm[y] || {})[mo] = r; });\n  const years = Object.keys(mm).map(Number).sort();\n  const tbl = `\u003cdiv class=\"scroll\" style=\"max-height:none\"\u003e\u003ctable class=\"heat\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eTahun\u003c/th\u003e${MONTHS.map(x =\u003e `\u003cth class=\"num\"\u003e${x}\u003c/th\u003e`).join(\"\")}\u003cth class=\"num\"\u003eTahun\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${years.map(y =\u003e `\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${y}\u003c/b\u003e\u003c/td\u003e${MONTHS.map((_, i) =\u003e { const v = mm[y][i + 1]; return `\u003ctd style=\"background:${heatCol(v, .12)}\"\u003e${v == null ? \"\" : nf(v * 100, 1)}\u003c/td\u003e`; }).join(\"\")}\u003ctd style=\"background:${heatCol(m.year_returns[y], .4)}\"\u003e\u003cb\u003e${pct(m.year_returns[y], 1)}\u003c/b\u003e\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`;\n  $(\"#monthly\").innerHTML = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eReturn bulanan (%) — tahun × bulan\u003c/h3\u003e${tbl}\u003cdiv class=\"sub\"\u003eReturn bulan = ekuitas akhir bulan ÷ ekuitas akhir bulan sebelumnya − 1 (bulan pertama terhadap modal awal). Tahun pertama dan terakhir bisa parsial.\u003c/div\u003e\u003c/div\u003e\n   \u003cdiv class=\"two\"\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eReturn per tahun\u003c/h3\u003e${legend([[\"Strategi\", PINK], ...BN.map((b, i) =\u003e [\"Buy \u0026 hold \" + bl(b), [SKY, LILAC][i]])])}\u003cdiv class=\"chart\" id=\"cYr\"\u003e\u003c/div\u003e\u003c/div\u003e\n   \u003cdiv class=\"card\"\u003e\u003ch3\u003eHistogram hasil trade (P/L % bersih)\u003c/h3\u003e\u003cdiv class=\"chart\" id=\"cHist\"\u003e\u003c/div\u003e\u003cdiv class=\"sub\" id=\"histNote\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`;\n  window.drawYr = () =\u003e { const by = BN.map(benchYear);\n    barChart($(\"#cYr\"), {groups: years.map(y =\u003e ({label: String(y), vals: [m.year_returns[y]].concat(by.map(o =\u003e o[y]))})), colors: [PINK, SKY, LILAC], names: [\"Strategi\"].concat(BN.map(bl)), yfmt: v =\u003e pct(v, 0), height: 250}); };\n  window.drawHist = () =\u003e { const v = D.trades.rows.map(r =\u003e r[9]), lo = -20, hi = 40, bw = 2.5, nb = Math.round((hi - lo) / bw), cnt = new Array(nb + 2).fill(0);\n    v.forEach(x =\u003e { cnt[x \u003c lo ? 0 : x \u003e= hi ? nb + 1 : 1 + Math.floor((x - lo) / bw)]++; });\n    const g = cnt.map((c, i) =\u003e ({label: i === 0 ? \"\u003c\" + lo : i === nb + 1 ? \"≥\" + hi : String(lo + (i - 1) * bw), vals: [c], neg: i === 0 || (lo + (i - 1) * bw) \u003c 0}));\n    barChart($(\"#cHist\"), {groups: g, colors: [SKY], yfmt: v =\u003e nf(v), height: 250}); $(\"#histNote\").textContent = `${nf(v.length)} trade tertutup; kolom dikelompokkan per ${bw}% (batang paling kiri/kanan = di luar rentang ${lo}% s/d ${hi}%).`;\n    document.querySelectorAll(\"#cHist rect\").forEach((r, i) =\u003e { r.setAttribute(\"fill\", g[i].neg ? PINK : SKY); }); };\n})();\n\n/* ---------- validitas ---------- */\nfunction metRow(label, a, b, f, better) { return `\u003ctr\u003e\u003ctd\u003e${label}\u003c/td\u003e\u003ctd class=\"num\"\u003e${f(a)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${f(b)}\u003c/td\u003e\u003c/tr\u003e`; }\n(function () {\n  const IS = D.is, OOS = D.oos, f = D.forward;\n  const rows = [[\"Periode\", x =\u003e `${x.start} → ${x.end}`], [\"CAGR\", x =\u003e pct(x.cagr)], [\"Max drawdown\", x =\u003e pct(x.mdd)], [\"Sharpe\", x =\u003e nf(x.sharpe, 2)], [\"Calmar\", x =\u003e nf(x.calmar, 2)],\n    [\"Win ratio\", x =\u003e pct(x.win_ratio, 1)], [\"Profit factor\", x =\u003e pfTxt(x.profit_factor)], [\"Expectancy\", x =\u003e pp(x.expectancy_pct)], [\"Jumlah trade\", x =\u003e nf(x.n_trades)], [\"Porsi biaya\", x =\u003e pct(x.cost_share, 1)]];\n  const A1 = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eA1. In-sample vs out-of-sample (70% / 30%)\u003c/h3\u003e\n   \u003cdiv class=\"sub\"\u003eParameter dipilih \u003cb\u003ehanya dari in-sample\u003c/b\u003e (${D.trials.grid} kombinasi grid, objektif: Sharpe tertinggi dengan minimal ${30} trade \u0026 CAGR \u0026gt; 0). Setiap segmen dijalankan dengan modal segar ${rp(C.capital)}.\u003c/div\u003e\n   \u003ctable style=\"margin-top:8px\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMetrik\u003c/th\u003e\u003cth class=\"num\"\u003eIn-sample\u003c/th\u003e\u003cth class=\"num\"\u003eOut-of-sample\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${rows.map(([l, g]) =\u003e `\u003ctr\u003e\u003ctd\u003e${l}\u003c/td\u003e\u003ctd class=\"num\"\u003e${g(IS)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${g(OOS)}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\n   \u003ch4\u003e10 kombinasi terbaik di in-sample\u003c/h4\u003e\u003cdiv class=\"scroll\" style=\"max-height:260px\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth class=\"num\"\u003eRSI\u003c/th\u003e\u003cth class=\"num\"\u003eMasuk\u003c/th\u003e\u003cth class=\"num\"\u003eKeluar\u003c/th\u003e\u003cth class=\"num\"\u003eSMA\u003c/th\u003e\u003cth class=\"num\"\u003eCAGR IS\u003c/th\u003e\u003cth class=\"num\"\u003eMDD IS\u003c/th\u003e\u003cth class=\"num\"\u003eSharpe IS\u003c/th\u003e\u003cth class=\"num\"\u003eTrade\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${D.opt_top.map((o, i) =\u003e `\u003ctr\u003e\u003ctd\u003e${i + 1}\u003c/td\u003e\u003ctd class=\"num\"\u003e${o.params.rsi_n}\u003c/td\u003e\u003ctd class=\"num\"\u003e${o.params.enter}\u003c/td\u003e\u003ctd class=\"num\"\u003e${o.params.exit}\u003c/td\u003e\u003ctd class=\"num\"\u003e${o.params.trend || \"—\"}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(o.cagr)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(o.mdd)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.sharpe, 2)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${o.n_trades}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e`;\n  const wfT = D.wf.length ? `\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eJendela latih\u003c/th\u003e\u003cth\u003eParameter terpilih (RSI/masuk/keluar/SMA)\u003c/th\u003e\u003cth class=\"num\"\u003eSharpe latih\u003c/th\u003e\u003cth\u003eJendela uji\u003c/th\u003e\u003cth class=\"num\"\u003eCAGR uji\u003c/th\u003e\u003cth class=\"num\"\u003eMDD uji\u003c/th\u003e\u003cth class=\"num\"\u003eSharpe uji\u003c/th\u003e\u003cth class=\"num\"\u003eTrade\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${D.wf.map(w =\u003e `\u003ctr\u003e\u003ctd\u003e${w.k}\u003c/td\u003e\u003ctd\u003e${w.train[0]} → ${w.train[1]}\u003c/td\u003e\u003ctd\u003e${w.params.rsi_n}/${w.params.enter}/${w.params.exit}/${w.params.trend || \"—\"}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(w.train_sharpe, 2)}\u003c/td\u003e\u003ctd\u003e${w.test.start} → ${w.test.end}\u003c/td\u003e\u003ctd class=\"num ${sg(w.test.cagr)}\"\u003e${pct(w.test.cagr)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(w.test.mdd)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(w.test.sharpe, 2)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${w.test.n_trades}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e` : '\u003cdiv class=\"note bad\"\u003eData tidak cukup untuk walk-forward.\u003c/div\u003e';\n  const mw = D.m_wf;\n  const A2 = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eA2. Walk-forward (latih ${C.wf_train} thn → uji ${C.wf_test} thn, digeser ${C.wf_test} thn; ${D.wf.length} jendela)\u003c/h3\u003e\n   \u003cdiv class=\"sub\"\u003eTiap jendela memilih parameter dari data latih saja (grid yang sama), lalu diuji pada jendela berikutnya. Kurva gabungan menyambung hasil semua jendela uji.\u003c/div\u003e\n   \u003cdiv class=\"scroll\" style=\"max-height:300px;margin-top:8px\"\u003e${wfT}\u003c/div\u003e\n   ${mw ? `\u003cdiv class=\"grid\" style=\"margin-top:10px\"\u003e${card(\"CAGR gabungan OOS\", pct(mw.cagr), \"semua jendela uji disambung\", sg(mw.cagr))}${card(\"MDD gabungan OOS\", pct(mw.mdd), \"\", \"neg\")}${card(\"Sharpe gabungan OOS\", nf(mw.sharpe, 2), \"\")}${card(\"Trade OOS\", nf(mw.n_trades), `win ratio ${pct(mw.win_ratio, 1)} · PF ${pfTxt(mw.profit_factor)}`)}\u003c/div\u003e\u003cdiv class=\"chart\" id=\"cWf\" style=\"margin-top:10px\"\u003e\u003c/div\u003e` : \"\"}\u003c/div\u003e`;\n  const sensKeys = Object.keys(D.sens), nameMap = {rsi_n: \"Periode RSI\", enter: \"Level masuk\", exit: \"Level keluar\", trend: \"Periode SMA tren\"};\n  const ss = D.sens_summary;\n  const A3 = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eA3. Sensitivitas parameter (±20% dan ±50%) — periode backtest penuh\u003c/h3\u003e\n   \u003cdiv class=\"sub\"\u003eSetiap parameter utama diubah sendiri-sendiri (yang lain tetap). Strategi lolos bila hasil di sekitar parameter terpilih tetap positif dan membentuk dataran, bukan satu puncak runcing.\u003c/div\u003e\n   \u003cdiv class=\"scroll\" style=\"max-height:none;margin-top:8px\"\u003e\u003ctable class=\"heat\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eParameter\u003c/th\u003e${C.sens_factors.map(x =\u003e `\u003cth class=\"num\"\u003e${x === 1 ? \"Terpilih\" : (x \u003e 1 ? \"+\" : \"\") + Math.round((x - 1) * 100) + \"%\"}\u003c/th\u003e`).join(\"\")}\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${sensKeys.map(k =\u003e `\u003ctr\u003e\u003ctd style=\"text-align:left\"\u003e\u003cb\u003e${nameMap[k]}\u003c/b\u003e\u003c/td\u003e${D.sens[k].map(c =\u003e `\u003ctd style=\"background:${heatCol(c.cagr, .3)}\"\u003e${c.value}\u003cbr\u003e\u003cspan class=\"sub\" style=\"color:#2f4156\"\u003eCAGR ${pct(c.cagr, 1)}\u003cbr\u003eMDD ${pct(c.mdd, 0)}\u003c/span\u003e\u003c/td\u003e`).join(\"\")}\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n   \u003ch4\u003eHeatmap CAGR: periode RSI × level masuk (nilai tengah = parameter terpilih)\u003c/h4\u003e\n   \u003cdiv class=\"scroll\" style=\"max-height:none\"\u003e\u003ctable class=\"heat\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eLevel masuk ↓ / RSI →\u003c/th\u003e${D.heat.cells[0].map(c =\u003e `\u003cth class=\"num\"\u003eRSI ${c.rsi_n}\u003c/th\u003e`).join(\"\")}\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${D.heat.cells.map(r =\u003e `\u003ctr\u003e\u003ctd style=\"text-align:left\"\u003e\u003cb\u003e${r[0].enter}\u003c/b\u003e\u003c/td\u003e${r.map(c =\u003e `\u003ctd style=\"background:${heatCol(c.cagr, .3)}\"\u003e${pct(c.cagr, 1)}\u003cbr\u003e\u003cspan class=\"sub\" style=\"color:#2f4156\"\u003eMDD ${pct(c.mdd, 0)}\u003c/span\u003e\u003c/td\u003e`).join(\"\")}\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n   \u003cdiv class=\"note ${ss.pass ? \"\" : \"bad\"}\"\u003e\u003cb\u003eHasil:\u003c/b\u003e ${nf(ss.positive_share * 100, 0)}% dari ${ss.n} kombinasi tetangga memiliki CAGR positif (median ${pct(ss.median_cagr, 1)} vs ${pct(ss.base_cagr, 1)} pada parameter terpilih; terburuk ${pct(ss.min_cagr, 1)}). ${ss.pass ? tag(\"LOLOS: membentuk dataran\", \"ok\") : ss.pass_positive ? tag(\"SEBAGIAN: tetangga positif tetapi puncak cukup runcing\", \"mid\") : tag(\"TIDAK LOLOS: hasil tidak stabil\", \"bad\")}\n   \u003cdiv class=\"sub\" style=\"margin-top:4px\"\u003eKriteria (ditetapkan di kode, \u003cspan class=\"mono\"\u003epipeline.py\u003c/span\u003e): lolos bila (1) ≥ 80% tetangga CAGR \u0026gt; 0 \u003cb\u003edan\u003c/b\u003e (2) median CAGR tetangga ≥ 50% dari CAGR parameter terpilih (dataran, bukan puncak runcing). Syarat 1: ${ss.pass_positive ? \"terpenuhi\" : \"tidak terpenuhi\"}; syarat 2: ${ss.plateau ? \"terpenuhi\" : \"tidak terpenuhi\"}.\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`;\n  const T = D.trials, R = D.robust;\n  const A4 = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eA4. Jumlah parameter \u0026 percobaan\u003c/h3\u003e\u003cul class=\"rules\"\u003e\u003cli\u003eParameter yang dioptimasi: \u003cb\u003e${T.optimized_params}\u003c/b\u003e (RSI periode, level masuk, level keluar, periode SMA) — maksimal 5.\u003c/li\u003e\n   \u003cli\u003eKombinasi dalam grid: \u003cb\u003e${nf(T.grid)}\u003c/b\u003e (level keluar ≤ level masuk). Grid: ${Object.entries(C.grid).map(([k, v]) =\u003e `${k} ∈ {${v.join(\", \")}}`).join(\"; \")}.\u003c/li\u003e\n   \u003cli\u003eTotal evaluasi selama riset: \u003cb\u003e${nf(T.total_runs)}\u003c/b\u003e run backtest (in-sample ${nf(T.is_runs)} + walk-forward ${nf(T.wf_runs)} + sensitivitas ${nf(T.sens_runs)}). Semakin banyak percobaan, semakin besar risiko overfitting.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n   \u003cdiv class=\"card\"\u003e\u003ch3\u003eA5. Uji ketahanan\u003c/h3\u003e\u003cdiv class=\"grid\"\u003e${card(\"Laba bersih total\", rp(R.total_pnl), \"trade tertutup\", sg(R.total_pnl))}${card(\"Konsentrasi laba\", pct(R.top5_share, 0), `5 trade terbaik = ${pct(R.top5_share, 0)} dan trade terbaik = ${pct(R.top1_share, 0)} dari laba bersih`, \"warn\")}${card(\"CAGR tanpa 5 trade terbaik\", pct(R.ex_top5.cagr), `backtest DIULANG dengan 5 trade itu diblokir · MDD ${pct(R.ex_top5.mdd)} · PF ${pfTxt(R.ex_top5.profit_factor)}`, sg(R.ex_top5.cagr))}${card(\"Tahun rugi\", `${R.loss_years} dari ${R.n_years}`, \"return kalender tahunan negatif\", R.loss_years ? \"warn\" : \"\")}\u003c/div\u003e\n   \u003cdiv class=\"sub\" style=\"margin-top:6px\"\u003e5 trade terbaik: ${R.top5.map(t =\u003e `${t.s} ${t.entry}→${t.exit} (${rp(t.pnl)}, ${pp(t.pct, 0)})`).join(\" · \")}. Pada uji \"tanpa 5 trade terbaik\", sinyal masuk tepat pada kombinasi (saham, tanggal) tersebut diabaikan dan slot diisi sinyal lain, sehingga ini simulasi ulang penuh (compounding ikut berubah).\u003c/div\u003e\n   ${D.mc ? `\u003ch4\u003eBonus: bootstrap return bulanan (${nf(D.mc.samples)} sampel, ${D.mc.months} bulan, dengan pengembalian)\u003c/h4\u003e\u003cdiv class=\"grid\"\u003e${card(\"CAGR persentil 5%\", pct(D.mc.cagr_p5), \"skenario buruk\", sg(D.mc.cagr_p5))}${card(\"CAGR median\", pct(D.mc.cagr_p50), \"\")}${card(\"CAGR persentil 95%\", pct(D.mc.cagr_p95), \"\")}${card(\"MDD persentil 5%\", pct(D.mc.mdd_p5), \"drawdown skenario buruk\", \"neg\")}${card(\"Peluang CAGR \u0026lt; 0\", pct(D.mc.prob_loss, 1), \"\")}\u003c/div\u003e` : \"\"}\u003c/div\u003e`;\n  /* B forward */\n  let B = \"\";\n  if (f) { const fm = f.metrics, bm = f.bench; const small = f.days \u003c 28;\n    B = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eB. Forward test — setelah tanggal pembekuan ${D.meta.freeze}\u003c/h3\u003e\n     \u003cdiv class=\"note ${small ? \"bad\" : \"\"}\"\u003e\u003cb\u003eMetode:\u003c/b\u003e tanggal pembekuan = \u003cb\u003e${D.meta.freeze}\u003c/b\u003e. Parameter dipilih memakai data sampai tanggal itu saja; setelahnya aturan dan parameter tidak diubah. Hasil di bawah memakai data \u003cb\u003e${PER.freeze} s/d ${PER.data_end}\u003c/b\u003e (${f.days} hari kalender, ${f.bars} hari bursa) dan dipisahkan dari backtest. Ini adalah \u003ci\u003euji hold-out atas data yang tersedia saat file dibuat\u003c/i\u003e, bukan paper trading real-time — untuk hasil real-time, jalankan ulang program dengan \u003cspan class=\"mono\"\u003e--params-file output/frozen_params.json\u003c/span\u003e pada data yang lebih baru.${small ? \" \u003cb\u003ePeriode forward \u0026lt; 4 minggu.\u003c/b\u003e\" : \"\"}\u003c/div\u003e\n     \u003cdiv class=\"grid\"\u003e${card(\"Return forward\", pct(fm.total_return), `ekuitas akhir ${rp(fm.end_equity)}`, sg(fm.total_return))}${card(\"Max drawdown\", pct(fm.mdd), \"\", \"neg\")}${card(\"Trade tertutup\", nf(fm.n_trades), `win ratio ${pct(fm.win_ratio, 1)} · PF ${pfTxt(fm.profit_factor)}`)}${card(\"Posisi terbuka\", nf(fm.n_open), `P/L mengambang ${rp(fm.open_unrealized)}`, sg(fm.open_unrealized))}${Object.entries(bm).map(([k, v]) =\u003e card(\"Buy \u0026 hold \" + bl(k), pct(v.ret), `MDD ${pct(v.mdd)}`, sg(v.ret))).join(\"\")}\u003c/div\u003e\n     \u003cdiv class=\"chart\" id=\"cFwd\" style=\"margin-top:10px\"\u003e\u003c/div\u003e\n     \u003cdiv class=\"sub\"\u003eSampel forward sangat pendek sehingga tidak cukup untuk menyimpulkan keandalan strategi; gunakan hanya sebagai pemeriksaan konsistensi.\u003c/div\u003e\n     \u003ch4\u003eTrade tertutup selama forward test\u003c/h4\u003e\u003cdiv class=\"scroll\" style=\"max-height:260px\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e${D.trades.cols.map(c =\u003e `\u003cth\u003e${c}\u003c/th\u003e`).join(\"\")}\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${f.trades.length ? f.trades.map(r =\u003e `\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${r[0]}\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e${r[1]}\u003c/td\u003e\u003ctd\u003e${r[2]}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(r[3])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(r[4])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${r[5]}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(r[6])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(r[7])}\u003c/td\u003e\u003ctd class=\"num ${sg(r[8])}\"\u003e${rp(r[8])}\u003c/td\u003e\u003ctd class=\"num ${sg(r[9])}\"\u003e${pp(r[9])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${r[10]}\u003c/td\u003e\u003ctd\u003e${esc(r[11])}\u003c/td\u003e\u003c/tr\u003e`).join(\"\") : '\u003ctr\u003e\u003ctd colspan=\"12\" class=\"sub\"\u003eBelum ada trade tertutup.\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n     \u003ch4\u003ePosisi terbuka di akhir forward test\u003c/h4\u003e\u003cdiv class=\"scroll\" style=\"max-height:240px\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eAset\u003c/th\u003e\u003cth\u003eTgl masuk\u003c/th\u003e\u003cth class=\"num\"\u003eHarga masuk\u003c/th\u003e\u003cth class=\"num\"\u003eLot\u003c/th\u003e\u003cth class=\"num\"\u003eHarga terakhir\u003c/th\u003e\u003cth class=\"num\"\u003eP/L mengambang\u003c/th\u003e\u003cth class=\"num\"\u003e%\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${f.open.length ? f.open.map(o =\u003e `\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${o.s}\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e${o.entry}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.entry_px)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.shares / C.lot)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(o.last)}\u003c/td\u003e\u003ctd class=\"num ${sg(o.unreal)}\"\u003e${rp(o.unreal)}\u003c/td\u003e\u003ctd class=\"num ${sg(o.unreal_pct)}\"\u003e${pp(o.unreal_pct)}\u003c/td\u003e\u003c/tr\u003e`).join(\"\") : '\u003ctr\u003e\u003ctd colspan=\"7\" class=\"sub\"\u003eTidak ada.\u003c/td\u003e\u003c/tr\u003e'}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e`;\n  } else B = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eB. Forward test\u003c/h3\u003e\u003cdiv class=\"note bad\"\u003eTidak ada data setelah tanggal pembekuan.\u003c/div\u003e\u003c/div\u003e`;\n  /* C look-ahead */\n  const dl = D.delay, d0 = dl.normal, d1 = dl.delay1;\n  const C1 = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eC. Bebas look-ahead bias\u003c/h3\u003e\u003cul class=\"rules\"\u003e\n   \u003cli\u003e\u003cb\u003eWaktu keputusan:\u003c/b\u003e sinyal memakai data sampai penutupan hari t; order dieksekusi paling cepat di \u003cb\u003eharga pembukaan t+1\u003c/b\u003e. Tidak ada pengisian di high/low atau di level yang baru diketahui setelah bar selesai.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eIndikator kausal:\u003c/b\u003e RSI Wilder (pemulusan eksponensial) dan SMA hanya memakai data sampai hari berjalan; tidak ada zigzag/pivot yang melukis ulang, moving average terpusat, atau normalisasi atas seluruh periode.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eLikuiditas:\u003c/b\u003e rata-rata nilai transaksi 20 hari dihitung sampai penutupan hari \u003ci\u003esebelum\u003c/i\u003e eksekusi (digeser 1 hari).\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eData fundamental:\u003c/b\u003e tidak dipakai.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eUji otomatis:\u003c/b\u003e \u003cspan class=\"mono\"\u003etests/run_tests.py\u003c/span\u003e mengubah seluruh data setelah hari k secara acak lalu menjalankan ulang; ekuitas, trade, sinyal, dan RSI sampai hari k harus identik (lulus pada pengembangan).\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eHarga disesuaikan aksi korporasi:\u003c/b\u003e ${esc(D.meta.price_note)}\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eSurvivorship bias:\u003c/b\u003e ${esc(D.meta.universe_note)}\u003c/li\u003e\u003c/ul\u003e\n   \u003ch4\u003eUji keterlambatan: eksekusi ditunda 1 bar tambahan (open t+2)\u003c/h4\u003e\n   \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMetrik\u003c/th\u003e\u003cth class=\"num\"\u003eNormal (open t+1)\u003c/th\u003e\u003cth class=\"num\"\u003eTunda 1 bar\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${[[\"CAGR\", x =\u003e pct(x.cagr)], [\"Max drawdown\", x =\u003e pct(x.mdd)], [\"Sharpe\", x =\u003e nf(x.sharpe, 2)], [\"Profit factor\", x =\u003e pfTxt(x.profit_factor)], [\"Win ratio\", x =\u003e pct(x.win_ratio, 1)], [\"Jumlah trade\", x =\u003e nf(x.n_trades)]].map(([l, g]) =\u003e `\u003ctr\u003e\u003ctd\u003e${l}\u003c/td\u003e\u003ctd class=\"num\"\u003e${g(d0)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${g(d1)}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`;\n  /* D execution */\n  const cs = D.cost, cl = [[\"sebelum_biaya\", \"Sebelum biaya (fee 0, spread 0)\"], [\"sesudah_biaya\", \"Sesudah biaya (1×) — dipakai di seluruh dashboard\"], [\"biaya_2x\", \"Uji stres: biaya 2× (fee ×2, spread 2 fraksi)\"]];\n  const D1 = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eD. Eksekusi realistis \u0026 uji stres biaya\u003c/h3\u003e\u003cul class=\"rules\"\u003e\u003cli\u003eFee beli ${pct(C.fee_buy, 2)}, jual ${pct(C.fee_sell, 2)}; spread minimal ${C.spread_ticks} fraksi per transaksi; harga dibulatkan ke fraksi BEI; jumlah kelipatan 1 lot; order ≤ ${pct(C.liq_cap, 0)} rata-rata nilai transaksi ${C.liq_days} hari; tanpa short/margin; ARA/ARB terkunci \u0026amp; hari tanpa volume tidak menghasilkan pengisian.\u003c/li\u003e\n   \u003cli\u003eDeteksi ARA/ARB memakai pendekatan dari data harian (open = high = low = close pada batas harga); data intraday/antrean order tidak tersedia.\u003c/li\u003e\u003c/ul\u003e\n   \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSkenario\u003c/th\u003e\u003cth class=\"num\"\u003eCAGR\u003c/th\u003e\u003cth class=\"num\"\u003eMDD\u003c/th\u003e\u003cth class=\"num\"\u003eSharpe\u003c/th\u003e\u003cth class=\"num\"\u003eProfit factor\u003c/th\u003e\u003cth class=\"num\"\u003eExpectancy\u003c/th\u003e\u003cth class=\"num\"\u003ePorsi biaya\u003c/th\u003e\u003cth class=\"num\"\u003eEkuitas akhir\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${cl.map(([k, l]) =\u003e { const x = cs[k]; return `\u003ctr\u003e\u003ctd\u003e${l}\u003c/td\u003e\u003ctd class=\"num ${sg(x.cagr)}\"\u003e${pct(x.cagr)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(x.mdd)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(x.sharpe, 2)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pfTxt(x.profit_factor)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pp(x.expectancy_pct)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${pct(x.cost_share, 1)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${rp(x.end_equity)}\u003c/td\u003e\u003c/tr\u003e`; }).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\n   \u003cdiv class=\"sub\" style=\"margin-top:6px\"\u003eTiap skenario adalah simulasi portofolio penuh yang dijalankan ulang. Karena ukuran posisi, slot, dan trade yang terisi berubah mengikuti kas, jalur ekuitasnya berbeda; hasil \"sebelum biaya\" bisa tampak sedikit lebih rendah dari \"sesudah biaya\" meski biaya selalu mengurangi laba trade yang sama. Ukuran bebas-jalur adalah \u003cb\u003eporsi biaya\u003c/b\u003e (fee + spread ÷ laba kotor) pada kolom di atas.\u003c/div\u003e\u003c/div\u003e`;\n  const FL = `\u003cdiv class=\"card\"\u003e\u003ch3\u003eTanda bahaya (PDF bagian 7) — pemeriksaan otomatis\u003c/h3\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePemeriksaan\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003cth\u003eDetail\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${D.flags.map(x =\u003e `\u003ctr\u003e\u003ctd\u003e${esc(x.name)}\u003c/td\u003e\u003ctd\u003e${x.triggered ? tag(\"TERPICU — perlu penjelasan\", \"bad\") : tag(\"tidak terpicu\", \"ok\")}\u003c/td\u003e\u003ctd\u003e${esc(x.detail)}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e`;\n  $(\"#validity\").innerHTML = `\u003ch3 style=\"margin:4px 0 10px\"\u003eA. Anti-overfitting\u003c/h3\u003e${A1}${A2}${A3}${A4}${B}${C1}${D1}${FL}`;\n  window.drawValidity = () =\u003e {\n    if (D.wf_curve) lineChart($(\"#cWf\"), {labels: D.wf_curve.d, series: [{name: \"OOS walk-forward gabungan\", color: PINK, values: D.wf_curve.e, w: 2.4}], log: true, yfmt: v =\u003e \"Rp\" + nf(v / 1e6, 0) + \" jt\", tipfmt: v =\u003e rp(v), height: 240});\n    if (f \u0026\u0026 $(\"#cFwd\")) lineChart($(\"#cFwd\"), {labels: f.equity.d, series: [{name: \"Ekuitas forward\", color: PINK, values: f.equity.e, w: 2.4}], yfmt: v =\u003e \"Rp\" + nf(v / 1e6, 1) + \" jt\", tipfmt: v =\u003e rp(v), height: 220});\n  };\n})();\n\n/* ---------- log trade ---------- */\n(function () {\n  const rows = D.trades.rows, cols = D.trades.cols; let sortK = 2, asc = false, q = \"\", page = 0; const PS = 100;\n  $(\"#tradelog\").innerHTML = `\u003cdiv class=\"card\"\u003e\u003cdiv class=\"bar\"\u003e\u003cinput type=\"text\" id=\"tq\" placeholder=\"Cari kode saham / alasan…\"\u003e\u003cbutton class=\"btn\" id=\"tcsv\"\u003e⬇ Unduh CSV\u003c/button\u003e\u003cspan class=\"sub\" id=\"tcount\"\u003e\u003c/span\u003e\u003cspan style=\"flex:1\"\u003e\u003c/span\u003e\u003cbutton class=\"btn\" id=\"tprev\"\u003e‹\u003c/button\u003e\u003cspan class=\"sub\" id=\"tpage\"\u003e\u003c/span\u003e\u003cbutton class=\"btn\" id=\"tnext\"\u003e›\u003c/button\u003e\u003c/div\u003e\n   \u003cdiv class=\"sub\" style=\"margin-bottom:6px\"\u003eData harian: order dieksekusi di pembukaan sesi 1 (≈ 09:00 WIB) pada tanggal tercantum. Biaya = fee (beli+jual); spread = selisih harga isi terhadap open (rupiah). P/L sudah bersih setelah fee dan spread. Klik judul kolom untuk mengurutkan.\u003c/div\u003e\n   \u003cdiv class=\"scroll\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e${cols.map((c, i) =\u003e `\u003cth data-i=\"${i}\" style=\"cursor:pointer\" class=\"${[3, 4, 5, 6, 7, 8, 9, 10].includes(i) ? \"num\" : \"\"}\"\u003e${c}${i === 1 || i === 2 ? \" (jam)\" : \"\"}\u003c/th\u003e`).join(\"\")}\u003c/tr\u003e\u003c/thead\u003e\u003ctbody id=\"tbody\"\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003c/div\u003e`;\n  function view() { let r = rows.filter(x =\u003e !q || x[0].toLowerCase().includes(q) || x[11].toLowerCase().includes(q));\n    r.sort((a, b) =\u003e { const x = a[sortK], y = b[sortK]; return (x \u003c y ? -1 : x \u003e y ? 1 : 0) * (asc ? 1 : -1); });\n    const pages = Math.max(1, Math.ceil(r.length / PS)); page = Math.min(page, pages - 1);\n    $(\"#tcount\").textContent = `${nf(r.length)} dari ${nf(rows.length)} trade`; $(\"#tpage\").textContent = `${page + 1} / ${pages}`;\n    $(\"#tbody\").innerHTML = r.slice(page * PS, page * PS + PS).map(x =\u003e `\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${x[0]}\u003c/b\u003e\u003c/td\u003e\u003ctd\u003e${x[1]} 09:00\u003c/td\u003e\u003ctd\u003e${x[2]} 09:00\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(x[3])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(x[4])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(x[5])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(x[6])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(x[7])}\u003c/td\u003e\u003ctd class=\"num ${sg(x[8])}\"\u003e${rp(x[8])}\u003c/td\u003e\u003ctd class=\"num ${sg(x[9])}\"\u003e${pp(x[9])}\u003c/td\u003e\u003ctd class=\"num\"\u003e${x[10]}\u003c/td\u003e\u003ctd\u003e${esc(x[11])}\u003c/td\u003e\u003c/tr\u003e`).join(\"\"); }\n  $(\"#tq\").oninput = e =\u003e { q = e.target.value.toLowerCase(); page = 0; view(); };\n  document.querySelectorAll(\"#tradelog th\").forEach(th =\u003e th.onclick = () =\u003e { const i = +th.dataset.i; if (sortK === i) asc = !asc; else { sortK = i; asc = true; } view(); });\n  $(\"#tprev\").onclick = () =\u003e { page = Math.max(0, page - 1); view(); }; $(\"#tnext\").onclick = () =\u003e { page++; view(); };\n  $(\"#tcsv\").onclick = () =\u003e { const esc2 = v =\u003e '\"' + String(v).replace(/\"/g, '\"\"') + '\"'; const csv = [cols.join(\",\")].concat(rows.map(r =\u003e r.map(esc2).join(\",\"))).join(\"\\n\");\n    const a = document.createElement(\"a\"); a.href = URL.createObjectURL(new Blob([csv], {type: \"text/csv\"})); a.download = \"log_trade.csv\"; a.click(); };\n  view();\n})();\n\n/* ---------- verifikasi ---------- */\n(function () {\n  const R = D.trades.rows, n = R.length, W = R.filter(r =\u003e r[8] \u003e 0), L = R.filter(r =\u003e r[8] \u003c= 0), avg = a =\u003e a.length ? a.reduce((x, y) =\u003e x + y, 0) / a.length : 0;\n  const wr = n ? W.length / n : NaN, ap = avg(W.map(r =\u003e r[9])), al = avg(L.map(r =\u003e r[9])), gp = W.reduce((x, r) =\u003e x + r[8], 0), gl = Math.abs(L.reduce((x, r) =\u003e x + r[8], 0));\n  const e = EQ.e, yrs = (dt(EQ.d[EQ.d.length - 1]) - dt(EQ.d[0])) / 864e5 / 365.25; let pk = C.capital, mdd = 0; e.forEach(v =\u003e { pk = Math.max(pk, v); mdd = Math.min(mdd, v / pk - 1); });\n  const fees = R.reduce((x, r) =\u003e x + r[6], 0), spr = R.reduce((x, r) =\u003e x + r[7], 0), gross = R.reduce((x, r) =\u003e x + r[8], 0) + fees + spr;\n  const checks = [[\"Jumlah trade\", n, m.n_trades, 0], [\"Win ratio\", wr, m.win_ratio, 1e-9], [\"Avg profit (%)\", ap, m.avg_profit_pct, 1e-5], [\"Avg loss (%)\", al, m.avg_loss_pct, 1e-5],\n    [\"Profit factor\", gl \u003e 0 ? gp / gl : null, m.profit_factor, 1e-6], [\"Expectancy (%)\", wr * ap + (1 - wr) * al, m.expectancy_pct, 1e-5], [\"Payoff ratio\", ap / Math.abs(al), m.payoff, 1e-5],\n    [\"Total fee (Rp)\", fees, m.total_fee, 0.5], [\"Total spread (Rp)\", spr, m.total_spread, 0.5], [\"Porsi biaya\", gross \u003e 0 ? (fees + spr) / gross : null, m.cost_share, 1e-5],\n    [\"CAGR (dari kurva ekuitas)\", Math.pow(e[e.length - 1] / C.capital, 1 / yrs) - 1, m.cagr, 1e-6], [\"Max drawdown (dari kurva ekuitas)\", mdd, m.mdd, 1e-6],\n    [\"Ekuitas akhir (Rp)\", e[e.length - 1], m.end_equity, 0.5]];\n  const ok = (a, b, t) =\u003e a == null \u0026\u0026 b == null ? true : a == null || b == null ? false : Math.abs(a - b) \u003c= t * Math.max(1, Math.abs(b));\n  const all = checks.every(c =\u003e ok(c[1], c[2], c[3]));\n  $(\"#verify\").innerHTML = `\u003cdiv class=\"card\"\u003e\u003cdiv class=\"sub\"\u003eHalaman ini menghitung ulang metrik langsung di browser dari JSON log trade dan kurva ekuitas harian yang tertanam, lalu membandingkannya dengan angka dari program Python. Tidak ada koneksi internet yang dipakai.\u003c/div\u003e\n   \u003cdiv class=\"note ${all ? \"\" : \"bad\"}\" style=\"margin-top:8px\"\u003e${all ? \"✔ Semua angka cocok dengan log trade dan kurva ekuitas.\" : \"✖ Ada angka yang tidak cocok — periksa baris bertanda ✖.\"}\u003c/div\u003e\n   \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eMetrik\u003c/th\u003e\u003cth class=\"num\"\u003eDihitung ulang (browser)\u003c/th\u003e\u003cth class=\"num\"\u003eDari program\u003c/th\u003e\u003cth\u003eCocok\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${checks.map(c =\u003e `\u003ctr\u003e\u003ctd\u003e${c[0]}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(c[1], 6)}\u003c/td\u003e\u003ctd class=\"num\"\u003e${nf(c[2], 6)}\u003c/td\u003e\u003ctd\u003e${ok(c[1], c[2], c[3]) ? tag(\"✔\", \"ok\") : tag(\"✖\", \"bad\")}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\n   \u003cdiv class=\"sub\" style=\"margin-top:6px\"\u003eData tertanam: ${nf(EQ.d.length)} titik ekuitas harian, ${nf(n)} trade (≈ ${nf(JSON.stringify(D).length / 1024, 0)} KB JSON).\u003c/div\u003e\u003c/div\u003e`;\n})();\n\n/* ---------- risiko ---------- */\n(function () {\n  const IS = D.is, OOS = D.oos, cs = D.cost, obs = [];\n  obs.push(`Biaya transaksi menurunkan CAGR dari ${pct(cs.sebelum_biaya.cagr)} (sebelum biaya) menjadi ${pct(cs.sesudah_biaya.cagr)} (sesudah biaya); dengan biaya 2× menjadi ${pct(cs.biaya_2x.cagr)}.`);\n  obs.push(`CAGR in-sample ${pct(IS.cagr)} vs out-of-sample ${pct(OOS.cagr)}${OOS.cagr \u003c IS.cagr ? \" — hasil memburuk di luar sampel, indikasi sebagian hasil in-sample berasal dari pencocokan parameter.\" : \".\"}`);\n  obs.push(`Eksekusi ditunda 1 bar: CAGR ${pct(D.delay.normal.cagr)} → ${pct(D.delay.delay1.cagr)}.`);\n  if (D.m_wf) obs.push(`Walk-forward: CAGR gabungan out-of-sample ${pct(D.m_wf.cagr)} (vs ${pct(m.cagr)} pada backtest penuh); ${D.wf.filter(w =\u003e w.test.cagr \u003e 0).length} dari ${D.wf.length} jendela uji positif.`);\n  if (D.robust.top5_share != null) obs.push(`Konsentrasi laba: 5 trade terbaik = ${pct(D.robust.top5_share, 0)} dari laba bersih; CAGR tanpa 5 trade itu ${pct(D.robust.ex_top5.cagr)}.`);\n  obs.push(`Sensitivitas parameter: ${nf(D.sens_summary.positive_share * 100, 0)}% tetangga bernilai positif (${D.sens_summary.pass ? \"dataran\" : D.sens_summary.pass_positive ? \"positif tetapi puncak cukup runcing\" : \"tidak stabil\"}).`);\n  obs.push(`Strategi ${m.cagr \u003e (D.bench[D.meta.benchmarks[0]] || {cagr: -9}).cagr ? \"mengungguli\" : \"tidak mengungguli\"} buy \u0026amp; hold ${bl(D.meta.benchmarks[0] || \"—\")} pada CAGR (${pct(m.cagr)} vs ${D.bench[D.meta.benchmarks[0]] ? pct(D.bench[D.meta.benchmarks[0]].cagr) : \"—\"}), dengan MDD ${pct(m.mdd)} vs ${D.bench[D.meta.benchmarks[0]] ? pct(D.bench[D.meta.benchmarks[0]].mdd) : \"—\"}.`);\n  const refl = D.texts.reflect.length ? D.texts.reflect.map(t =\u003e `\u003cp\u003e${esc(t)}\u003c/p\u003e`).join(\"\") : '\u003cp class=\"sub\"\u003e(Refleksi pribadi belum diisi — tulis pada \u003cspan class=\"mono\"\u003eREFLEKSI\u003c/span\u003e di \u003cspan class=\"mono\"\u003esrc/config.py\u003c/span\u003e lalu bangun ulang.)\u003c/p\u003e';\n  $(\"#risks\").innerHTML = `\u003cdiv class=\"two\"\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003eKeterbatasan \u0026 risiko\u003c/h3\u003e\u003cul class=\"rules\"\u003e\n   \u003cli\u003e\u003cb\u003eSurvivorship bias:\u003c/b\u003e universe tetap (komposisi saat data diambil) dipakai untuk seluruh periode; saham yang sudah keluar/delisting tidak ikut → hasil bias optimis.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eRisiko overfitting:\u003c/b\u003e ${nf(D.trials.total_runs)} evaluasi dilakukan; parameter dipilih dari in-sample. Periode out-of-sample (≈${nf(PER.bt_years * (1 - C.is_fraction), 1)} tahun) hanya mencakup satu rezim pasar.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eMetrik utama mencakup in-sample:\u003c/b\u003e kartu metrik memakai seluruh periode backtest; pembuktian ketahanan ada pada OOS, walk-forward, dan forward test.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eKualitas data:\u003c/b\u003e ${esc(D.meta.data_risk)}\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eEksekusi disederhanakan:\u003c/b\u003e pengisian di harga pembukaan ± spread tetap (tanpa antrean order/slippage tambahan); ARA/ARB dideteksi dari data harian; tanpa dampak harga pasar selain batas 5% likuiditas.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eDividen/pajak:\u003c/b\u003e dividen tunai tidak diterima; pajak dividen tidak dimodelkan. Tidak ada stop-loss sehingga kerugian per trade tidak dibatasi.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eForward test pendek:\u003c/b\u003e ${D.forward ? D.forward.days + \" hari kalender\" : \"tidak ada\"}; belum cukup untuk kesimpulan statistik.\u003c/li\u003e\n   \u003cli\u003e\u003cb\u003eBukan nasihat investasi.\u003c/b\u003e Hasil historis tidak menjamin kinerja masa depan.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n   \u003cdiv class=\"card\"\u003e\u003ch3\u003ePengamatan dari data \u0026 refleksi\u003c/h3\u003e\u003cul class=\"rules\"\u003e${obs.map(o =\u003e `\u003cli\u003e${o}\u003c/li\u003e`).join(\"\")}\u003c/ul\u003e\u003ch4\u003eRefleksi pribadi\u003c/h4\u003e${refl}\u003c/div\u003e\u003c/div\u003e`;\n})();\n\n/* ---------- pernyataan ---------- */\n$(\"#statement\").innerHTML = `\u003cdiv class=\"card\"\u003e\u003ch3\u003ePenggunaan AI\u003c/h3\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eAlat\u003c/th\u003e\u003cth\u003eDigunakan untuk\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${D.texts.ai.map(a =\u003e `\u003ctr\u003e\u003ctd\u003e\u003cb\u003e${esc(a[0])}\u003c/b\u003e\u003c/td\u003e\u003ctd style=\"white-space:normal\"\u003e${esc(a[1])}\u003c/td\u003e\u003c/tr\u003e`).join(\"\")}\u003c/tbody\u003e\u003c/table\u003e\n  \u003cp\u003e${esc(D.texts.student)}\u003c/p\u003e\u003ch3 style=\"margin-top:14px\"\u003ePernyataan keaslian\u003c/h3\u003e\u003cp\u003e${esc(D.texts.attest)}\u003c/p\u00 n class=\"badge\"\u003e${esc(x.status)}\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e`));\n        document.querySelector(\"#forward-trades\").innerHTML = table([\"Pair\",\"Opened\",\"Closed\",\"P/L\",\"Fee\",\"Spread Est.\"], forwardTrades.slice().reverse().map(x =\u003e `\u003ctr\u003e\u003ctd\u003e${esc(x.pair)}\u003c/td\u003e\u003ctd\u003e${esc(x.opened_at)}\u003c/td\u003e\u003ctd\u003e${esc(x.closed_at)}\u003c/td\u003e\u003ctd class=\"${x.pnl_idr \u003e= 0 ? \"positive\" : \"negative\"}\"\u003e${idr(x.pnl_idr)}\u003c/td\u003e\u003ctd\u003e${idr(x.fee_idr)}\u003c/td\u003e\u003ctd\u003e${idr(x.spread_cost_idr)}\u003c/td\u003e\u003c/tr\u003e`));\n        const snapshots = live.snapshots || [], last = {};\n        snapshots.forEach(x =\u003e { if (!last[x.pair] || x.time \u003e last[x.pair].time) last[x.pair] = x; });\n        document.querySelector(\"#spreads\").innerHTML = table([\"Pair\",\"Best Bid\",\"Best Ask\",\"Spread\",\"Observed\"], Object.values(last).map(x =\u003e `\u003ctr\u003e\u003ctd\u003e${esc(x.pair)}\u003c/td\u003e\u003ctd\u003e${idr(x.best_bid)}\u003c/td\u003e\u003ctd\u003e${idr(x.best_ask)}\u003c/td\u003e\u003ctd\u003e${(Number(x.spread_pct)*100).toFixed(4)}%\u003c/td\u003e\u003ctd\u003e${esc(x.time)}\u003c/td\u003e\u003c/tr\u003e`));\n        if (backtest \u0026\u0026 backtest.metrics) {\n          const m = backtest.metrics;\n          document.querySelector(\"#backtest\").innerHTML = [\n            metric(\"Total Return\", pct(m.total_return), m.total_return \u003e= 0 ? \"positive\" : \"negative\"),\n            metric(\"CAGR\", pct(m.cagr)), metric(\"Max Drawdown\", pct(m.max_drawdown), \"negative\"),\n            metric(\"Closed Trades\", m.trade_count), metric(\"Win Rate\", pct(m.win_rate)),\n            metric(\"Profit Factor\", m.profit_factor == null ? \"-\" : Number(m.profit_factor).toFixed(2)),\n            metric(\"Avg Win\", idr(m.average_win_idr)), metric(\"Avg Loss\", idr(m.average_loss_idr), \"negative\"),\n            metric(\"Total Fee\", idr(m.total_fees_idr)), metric(\"Est. Spread Cost\", idr(m.total_spread_estimate_idr))\n          ].join(\"\");\n          document.querySelector(\"#trades\").innerHTML = table([\"Pair\",\"Entry\",\"Exit\",\"P/L\",\"Fee\",\"Spread Est.\"], (backtest.trades || []).slice().reverse().map(x =\u003e `\u003ctr\u003e\u003ctd\u003e${esc(x.pair)}\u003c/td\u003e\u003ctd\u003e${new Date(x.entry_time*1000).toLocaleDateString(\"id-ID\")}\u003c/td\u003e\u003ctd\u003e${new Date(x.exit_time*1000).toLocaleDateString(\"id-ID\")}\u003c/td\u003e\u003ctd class=\"${x.pnl_idr \u003e= 0 ? \"positive\" : \"negative\"}\"\u003e${idr(x.pnl_idr)}\u003c/td\u003e\u003ctd\u003e${idr(x.fee_idr)}\u003c/td\u003e\u003ctd\u003e${Number(x.spread_estimate_pct).toFixed(4)}%\u003c/td\u003e\u003c/tr\u003e`));\n          const points = backtest.equity || [];\n          const values = points.map(x=\u003eNumber(x.equity)).filter(Number.isFinite);\n          const min = Math.min(...values), max = Math.max(...values), span = max-min || 1;\n          const path = values.map((value,index)=\u003e`${index ? \"L\" : \"M\"}${(index/(values.length-1||1)*640).toFixed(1)} ${(108-(value-min)/span*96).toFixed(1)}`).join(\" \");\n          const chart = values.length ? `\u003csvg viewBox=\"0 0 640 120\" role=\"img\" aria-label=\"Kurva ekuitas backtest\" style=\"width:100%;height:auto\"\u003e\u003cpath d=\"${path}\" fill=\"none\" stroke=\"#136b50\" stroke-width=\"2.5\"/\u003e\u003cline x1=\"0\" x2=\"640\" y1=\"108\" y2=\"108\" stroke=\"#d6e1dd\"/\u003e\u003c/svg\u003e` : \"\";\n          const summary = table([\"End\",\"Days\",\"Start\",\"Final\",\"Buy \u0026 Hold\"], [`\u003ctr\u003e\u003ctd\u003e${new Date(m.end_time*1000).toLocaleDateString(\"id-ID\")}\u003c/td\u003e\u003ctd\u003e${Math.round(m.days)}\u003c/td\u003e\u003ctd\u003e${idr(m.initial_cash)}\u003c/td\u003e\u003ctd\u003e${idr(m.final_equity)}\u003c/td\u003e\u003ctd\u003e${pct(m.benchmark_equal_weight_return)}\u003c/td\u003e\u003c/tr\u003e`]);\n          document.querySelector(\"#equity\").innerHTML = chart + `\u003cdiv class=\"empty\"\u003eBuy-and-hold equal-weight: ${idr(m.benchmark_equal_weight_final_idr)} (${pct(m.benchmark_equal_weight_return)}). Spread memakai median snapshot order book.\u003c/div\u003e` + summary;\n        } else {\n          document.querySelector(\"#backtest\").innerHTML = `\u003cdiv class=\"metric\" style=\"grid-column:1/-1\"\u003e\u003csmall\u003eBelum tersedia\u003c/small\u003e\u003cb\u003eBelum ada backtest terverifikasi\u003c/b\u003e\u003c/div\u003e`;\n          document.querySelector(\"#trades\").innerHTML = `\u003cdiv class=\"empty\"\u003eJalankan alat riset setelah snapshot spread memadai terkumpul.\u003c/div\u003e`;\n          document.querySelector(\"#equity\").innerHTML = `\u003cdiv class=\"empty\"\u003eTidak ada kurva ekuitas yang ditampilkan sebelum hasil dihitung.\u003c/div\u003e`;\n        }\n        document.querySelector(\"#events\").innerHTML = table([\"Waktu\",\"Jenis\",\"Detail\",\"Pair\"], (live.events || []).slice().reverse().map(x =\u003e `\u003ctr\u003e\u003ctd\u003e${esc(x.time)}\u003c/td\u003e\u003ctd\u003e${esc(x.kind)}\u003c/td\u003e\u003ctd\u003e${esc(x.message)}\u003c/td\u003e\u003ctd\u003e${esc(x.pair)}\u003c/td\u003e\u003c/tr\u003e`));\n        document.querySelector(\"#updated\").textContent = \"Diperbarui \" + new Date().toLocaleTimeString(\"id-ID\");\n      } catch (error) {\n        notice.className = \"banner bad\";\n        notice.textContent = \"Status belum tersambung: \" + error.message + \". Pastikan API dan penyimpanan state tersedia.\";\n        document.querySelector(\"#live-metrics\").innerHTML = [metric(\"Status\", \"Unavailable\", \"negative\"), metric(\"Dry-Run\", \"Tidak mengirim order\")].join(\"\");\n      }\n    }\n    document.querySelector(\"#refresh\").addEventListener(\"click\", render);\n    document.querySelector(\"#export\").addEventListener(\"click\", async () =\u003e {\n      try {\n        let blob;\n        if (embeddedData) {\n          blob = new Blob([JSON.stringify(embeddedData, null, 2)], {type:\"application/json\"});\n        } else {\n          const response = await fetch(\"/api/export\", {cache:\"no-store\"});\n          if (!response.ok) throw new Error(response.status + \" \" + response.statusText);\n          blob = await response.blob();\n        }\n        const link = document.createElement(\"a\");\n        link.href = URL.createObjectURL(blob);\n        link.download = `indodax-dry-run-${new Date().toISOString().replace(/[:.]/g,\"-\")}.json`;\n        link.click();\n        URL.revokeObjectURL(link.href);\n      } catch (error) {\n        document.querySelector(\"#notice\").textContent = \"Ekspor gagal: \" + error.message;\n      }\n    });\n    render();\n  \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e"}</script>
  <script>
